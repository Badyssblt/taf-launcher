# Deploiement sur le VPS (Traefik v3 existant, reseau externe "traefik").
# Depuis /home/debian/taf-launcher : docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
name: taf-launcher

services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: https://launcher.badyssblilita.fr
      DATABASE_URL: postgres://taf:${POSTGRES_PASSWORD}@db:5432/taf
      SIGNING_KEY: ${SIGNING_KEY}
      ADMIN_PSEUDO: ${ADMIN_PSEUDO:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.taf-launcher.entrypoints: websecure
      traefik.http.routers.taf-launcher.rule: Host(`launcher.badyssblilita.fr`)
      traefik.http.routers.taf-launcher.tls.certresolver: letsencrypt
      traefik.http.services.taf-launcher.loadbalancer.server.port: "3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taf -d taf"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  pgdata:

networks:
  traefik:
    external: true
