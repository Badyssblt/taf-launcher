[package]
name = "installer-core"
version = "0.1.0"
edition = "2021"
description = "Moteur d'installation et de mise a jour des jeux (sans dependance Tauri, donc testable)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "net"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
