name: Deploy backend

# Deploie sur le VPS a chaque push sur main qui touche le backend.
# Actif seulement si la variable de depot DEPLOY_ENABLED vaut "true" (Settings > Secrets and variables > Actions > Variables),
# avec les secrets VPS_HOST, VPS_USER et VPS_SSH_KEY (cle privee dediee, voir README).
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**']
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/debian/taf-launcher
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
            docker image prune -f
